<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Vibrant Purple to Deep Violet -->
    <linearGradient id="travelgoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#652BE8" />
      <stop offset="100%" stop-color="#5218C5" />
    </linearGradient>

    <!-- Wing Top Gradient: Pure Crisp White -->
    <linearGradient id="wingTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>

    <!-- Wing Bottom Gradient: Subtle Lavender Shading for Origami Depth -->
    <linearGradient id="wingShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE5FF" />
      <stop offset="100%" stop-color="#D8CCFF" />
    </linearGradient>

    <!-- Fold Crease Gradient -->
    <linearGradient id="foldCrease" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD2FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3B0764" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect width="128" height="128" rx="30" fill="url(#travelgoBg)" />

  <!-- Inner Specular Border Highlight -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25" />

  <!-- Dynamic Origami Paper Plane pointing up-right -->
  <g transform="translate(64, 64) rotate(-8) translate(-64, -64)" filter="url(#softGlow)">
    <!-- Right / Upper Main Wing -->
    <path 
      d="M 104 26 L 30 68 L 56 78 Z" 
      fill="url(#wingTop)" 
    />

    <!-- Left / Lower Wing with Facet Shading -->
    <path 
      d="M 104 26 L 56 78 L 74 102 Z" 
      fill="url(#wingShade)" 
    />

    <!-- Center Fold Keel -->
    <path 
      d="M 56 78 L 68 89 L 74 102 Z" 
      fill="url(#foldCrease)" 
    />

    <!-- Inner Crease Line for High-End Origami Definition -->
    <path 
      d="M 104 26 L 56 78" 
      stroke="#DDD6FE" 
      stroke-width="1.2" 
      stroke-linecap="round" 
    />
  </g>
</svg>
