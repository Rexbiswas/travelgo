<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Navy to Vibrant Cyan Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e36" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Airplane Gradient: Crisp White with Subtle Cyan Tint -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Trail / Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Globe / Curved Flight Arc -->
  <path d="M 24 100 C 35 60, 75 35, 108 44" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 4" opacity="0.8" />
  
  <circle cx="24" cy="100" r="3" fill="#38bdf8" />
  
  <!-- Stylized Modern Airplane -->
  <g transform="translate(62, 62) rotate(-35) translate(-36, -36)" filter="url(#glow)">
    <!-- Airplane Body -->
    <path 
      d="M 36 6 C 35 6, 33 12, 33 24 L 6 42 L 6 50 L 33 42 L 33 60 L 24 66 L 24 72 L 36 69 L 48 72 L 48 66 L 39 60 L 39 42 L 66 50 L 66 42 L 39 24 C 39 12, 37 6, 36 6 Z" 
      fill="url(#planeGrad)" 
    />
    <!-- Jet Trail Flare -->
    <circle cx="36" cy="69" r="2.5" fill="#38bdf8" />
  </g>
</svg>
